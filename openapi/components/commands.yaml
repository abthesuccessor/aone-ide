GetWorkspaceFilesArgs:
  type: object
  additionalProperties: false
  properties:
    query:
      type: string
      maxLength: 256
      pattern: '^[^\u0000-\u001F\u007F-\u009F]*$'
      description: Optional case-insensitive path substring searched across the complete indexed workspace.
    limit:
      type: integer
      minimum: 1
      maximum: 5000
      default: 500
      description: The backend caps unfiltered lists at 5000 files and search results at 200 matches.
