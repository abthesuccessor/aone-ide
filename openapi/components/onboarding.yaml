CloneGithubRepositoryRequest:
  type: object
  additionalProperties: false
  required: [repositoryUrl, destinationName]
  properties:
    repositoryUrl:
      type: string
      minLength: 20
      maxLength: 300
      pattern: '^https://github\.com/[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}(?:\.git)?$'
      description: Credential-free public GitHub HTTPS URL. The backend normalizes and revalidates it.
    destinationName:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$'
      description: One safe direct child name under the backend-resolved Documents directory.
CreateDocumentsProjectRequest:
  type: object
  additionalProperties: false
  required: [projectName, initializeGit]
  properties:
    projectName:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$'
    initializeGit:
      type: boolean
InspectGitOnboardingRequest:
  type: object
  additionalProperties: false
  required: [workspaceId]
  properties:
    workspaceId:
      type: string
      minLength: 1
      maxLength: 200
ProjectBootstrapAction:
  type: string
  enum: [clone, create]
ProjectBootstrapResult:
  type: object
  additionalProperties: false
  required: [action, workspace, destinationHint]
  properties:
    action:
      $ref: '#/ProjectBootstrapAction'
    workspace:
      $ref: ./workspace.yaml#/WorkspaceSummary
    destinationHint:
      type: string
      maxLength: 220
    repositoryUrl:
      type: string
      maxLength: 300
GitIdentitySource:
  type: string
  enum: [local, global]
GitOnboardingIdentity:
  type: object
  additionalProperties: false
  required: [source]
  properties:
    name:
      type: string
      maxLength: 200
    email:
      type: string
      maxLength: 240
    source:
      $ref: '#/GitIdentitySource'
GitRemoteTransport:
  type: string
  enum: [https, ssh, other, local]
GitOnboardingRemote:
  type: object
  additionalProperties: false
  required: [name, displayUrl, transport]
  properties:
    name:
      type: string
      maxLength: 64
    displayUrl:
      type: string
      maxLength: 2048
      description: Credential, query, fragment, and local-path-redacted remote display.
    host:
      type: string
      maxLength: 253
    ownerRepo:
      type: string
      maxLength: 201
    transport:
      $ref: '#/GitRemoteTransport'
GitOnboardingPublicKey:
  type: object
  additionalProperties: false
  required: [fileName, keyType, fingerprint]
  properties:
    fileName:
      type: string
      maxLength: 255
    keyType:
      type: string
      maxLength: 64
    fingerprint:
      type: string
      maxLength: 80
      pattern: '^SHA256:[A-Za-z0-9+/]+$'
GitOnboardingReport:
  type: object
  additionalProperties: false
  required: [workspaceId, inspectedAt, isRepository, remotes, publicKeys, privateKeysRead]
  properties:
    workspaceId:
      type: string
      maxLength: 200
    inspectedAt:
      type: string
    isRepository:
      type: boolean
    branch:
      type: string
      maxLength: 200
    identity:
      $ref: '#/GitOnboardingIdentity'
    remotes:
      type: array
      maxItems: 32
      items:
        $ref: '#/GitOnboardingRemote'
    publicKeys:
      type: array
      maxItems: 16
      items:
        $ref: '#/GitOnboardingPublicKey'
    privateKeysRead:
      type: boolean
      description: Always false. Aone never opens private key files.
OptionalGitOnboardingReport:
  oneOf:
    - $ref: '#/GitOnboardingReport'
    - type: 'null'
CloneGithubRepositoryArgs:
  type: object
  additionalProperties: false
  required: [request]
  properties:
    request:
      $ref: '#/CloneGithubRepositoryRequest'
CreateDocumentsProjectArgs:
  type: object
  additionalProperties: false
  required: [request]
  properties:
    request:
      $ref: '#/CreateDocumentsProjectRequest'
InspectGitOnboardingArgs:
  type: object
  additionalProperties: false
  required: [request]
  properties:
    request:
      $ref: '#/InspectGitOnboardingRequest'
