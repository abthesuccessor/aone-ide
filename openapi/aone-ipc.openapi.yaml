    WebSocketConnectArgs: { $ref: ./components/commands.yaml#/WebSocketConnectArgs }
    WebSocketSendArgs: { $ref: ./components/commands.yaml#/WebSocketSendArgs }
    WebSocketDisconnectArgs: { $ref: ./components/commands.yaml#/WebSocketDisconnectArgs }
