    OptionalGitOnboardingReport: { $ref: ./components/onboarding.yaml#/OptionalGitOnboardingReport }
    CloneGithubRepositoryArgs: { $ref: ./components/onboarding.yaml#/CloneGithubRepositoryArgs }
    CreateDocumentsProjectArgs: { $ref: ./components/onboarding.yaml#/CreateDocumentsProjectArgs }
