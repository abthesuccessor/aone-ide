  schemas:
    AppSnapshot: { $ref: ./components/common.yaml#/AppSnapshot }
    EnvLoadResult: { $ref: ./components/common.yaml#/EnvLoadResult }
    CapabilityLevel: { $ref: ./components/workspace.yaml#/CapabilityLevel }
    LanguageSummary: { $ref: ./components/workspace.yaml#/LanguageSummary }
    WorkspaceSummary: { $ref: ./components/workspace.yaml#/WorkspaceSummary }
    OpenFileResult: { $ref: ./components/workspace.yaml#/OpenFileResult }
    OptionalOpenFileResult: { $ref: ./components/workspace.yaml#/OptionalOpenFileResult }
    CloneGithubRepositoryRequest: { $ref: ./components/onboarding.yaml#/CloneGithubRepositoryRequest }
    CreateDocumentsProjectRequest: { $ref: ./components/onboarding.yaml#/CreateDocumentsProjectRequest }
    InspectGitOnboardingRequest: { $ref: ./components/onboarding.yaml#/InspectGitOnboardingRequest }
    ProjectBootstrapAction: { $ref: ./components/onboarding.yaml#/ProjectBootstrapAction }
