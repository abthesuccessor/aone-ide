name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Full check (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Use the pinned Node version
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Use the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Aone deliberately runs the fixed /usr/bin/git rather than searching
      # PATH. That path is the macOS developer-tools shim, which refuses to run
      # unless it can resolve an active developer directory, so pin the one the
      # runner actually has before any git-backed test executes.
      - name: Pin the active developer directory for /usr/bin/git
        run: |
          echo "xcode-select -p: $(xcode-select -p 2>&1 || true)"
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          /usr/bin/git --version || true
          probe="$(mktemp -d)"
          ( cd "$probe" && DEVELOPER_DIR="$(xcode-select -p)" \
              /usr/bin/git --no-pager init --template= -b main . ) \
            && echo "git init probe: ok" \
            || { echo "git init probe: FAILED"; exit 1; }

      - name: Install dependencies
        run: npm ci

      # structure, OpenAPI/AsyncAPI contracts, build, bundle size, frontend
      # tests, download-site tests, clippy/rustfmt, and the Rust test suite.
      - name: Run the full check gate
        run: npm run check
