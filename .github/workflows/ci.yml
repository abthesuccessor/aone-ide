name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Full check (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Use the pinned Node version
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Use the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Aone deliberately runs the fixed /usr/bin/git rather than searching
      # PATH, so it is bound to whatever Git the active developer tools ship —
      # on this runner Apple Git 2.39.5. Git rejects an unknown top-level option
      # outright, so a flag newer than the platform Git breaks every operation
      # rather than degrading one. This step is a regression guard: it runs the
      # real flag set and fails loudly if a too-new option is reintroduced,
      # instead of letting it surface as opaque test assertions.
      - name: Verify the fixed git accepts Aone's flag set
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$(xcode-select -p)"
          version="$(/usr/bin/git --version 2>&1 || true)"
          {
            echo '### Fixed git executable'
            echo '```'
            echo "xcode-select -p : $(xcode-select -p 2>&1 || true)"
            echo "git --version   : ${version}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          probe="$(mktemp -d)"
          cd "$probe"
          if ! /usr/bin/git \
              --no-pager --no-replace-objects --no-optional-locks \
              --literal-pathspecs \
              -c core.fsmonitor=false -c core.hooksPath=/dev/null \
              -c commit.gpgSign=false -c diff.external= \
              -c core.attributesFile=/dev/null -c core.excludesFile=/dev/null \
              -c credential.helper= \
              init --template= . ; then
            echo "::error::${version} rejected Aone's git flag set." \
                 "A flag newer than the platform Git was likely introduced."
            exit 1
          fi
          echo "flag set accepted by ${version}"

      - name: Install dependencies
        run: npm ci

      # structure, OpenAPI/AsyncAPI contracts, build, bundle size, frontend
      # tests, download-site tests, clippy/rustfmt, and the Rust test suite.
      - name: Run the full check gate
        run: npm run check
