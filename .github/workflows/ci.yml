name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Full check (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Use the pinned Node version
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Use the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Aone deliberately runs the fixed /usr/bin/git rather than searching
      # PATH. That path is the macOS developer-tools shim, which refuses to run
      # unless it can resolve an active developer directory, so pin the one the
      # runner actually has before any git-backed test executes.
      - name: Pin the active developer directory for /usr/bin/git
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          {
            echo '### Fixed git executable'
            echo '```'
            echo "xcode-select -p : $(xcode-select -p 2>&1 || true)"
            echo "git --version   : $(/usr/bin/git --version 2>&1 || true)"
            probe="$(mktemp -d)"
            # The exact flag set src/git/process.rs uses. Several of these are
            # recent; an older Apple Git rejects them outright, which surfaces
            # as an opaque "init failed" in the tests.
            ( cd "$probe" && DEVELOPER_DIR="$(xcode-select -p)" /usr/bin/git \
                --no-pager --no-replace-objects --no-lazy-fetch \
                --no-optional-locks --literal-pathspecs init --template= . ) 2>&1 \
              && echo 'full flag probe : ok' || echo 'full flag probe : FAILED'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      # structure, OpenAPI/AsyncAPI contracts, build, bundle size, frontend
      # tests, download-site tests, clippy/rustfmt, and the Rust test suite.
      - name: Run the full check gate
        run: npm run check
